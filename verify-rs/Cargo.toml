# Apache-2.0 (public verifier repo)
[package]
name = "swarrm-verify"
version = "1.0.5"
edition = "2021"
description = "Public Rust/WASM second implementation for evidence bundles, certificates, and CWT/COSE-only B28 assurance"
# Declared, not merely stated in the header comment above: wasm-pack reads these
# and every published artifact carries the licence it is actually under.
license = "Apache-2.0"
repository = "https://github.com/capxholding/swarrm-verify"

[lib]
crate-type = ["rlib", "cdylib"]  # cdylib is the browser/Node wasm-pack surface

[dependencies]
serde = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }
# RFC 8785 uses ECMAScript Number::toString for finite binary64 values.
ryu-js = "=1.0.3"
# `oid` feature: digest types carry AssociatedOid so rsa's Pkcs1v15Sign can
# build the DigestInfo prefix (const-oid is already in the graph via der/p256).
sha2 = { version = "0.10", features = ["oid"] }
ed25519-dalek = "2"
base64 = "0.22"
# RFC 3161 parity crates. Exact pins are mirrored in ci/architecture_policy.json.
p256 = "=0.13.2"
# RSA and P-384 support RFC 3161/TSA certificate chains. These pure-Rust
# dependencies and their exact pins are mirrored in ci/architecture_policy.json.
p384 = "=0.13.1"
rsa = "=0.9.10"
# B24 CBOR primitives — owner sanction O·1 (§0.2·3): ciborium is the ONLY
# Rust CBOR codec; the canonical emitter in src/cbor.rs owns determinism
# (ciborium does not sort map keys). Exact pin mirrored in the policy file.
ciborium = "=0.2.2"
der = "=0.7.10"
x509-cert = "=0.2.5"
cms = "=0.2.3"
wasm-bindgen = { version = "0.2", optional = true }

# NOT a new crate: getrandom is already in the graph via the sanctioned p256
# (ecdsa -> signature/rand_core; rand_core/std needs an entropy source). This
# entry only turns on its JS shim so the wasm verifier page keeps building —
# the verifier itself never draws randomness (verify-only).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[features]
wasm = ["dep:wasm-bindgen"]

[dev-dependencies]
