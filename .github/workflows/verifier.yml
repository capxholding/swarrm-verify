name: verifier

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path verify-rs/Cargo.toml --check
      - run: cargo test --manifest-path verify-rs/Cargo.toml

  browser-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: wasm32-unknown-unknown
      - name: Install the pinned wasm-pack release
        run: |
          wasm_pack_archive="$RUNNER_TEMP/wasm-pack.tar.gz"
          wasm_pack_dir="$RUNNER_TEMP/wasm-pack-v0.15.0-x86_64-unknown-linux-musl"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$wasm_pack_archive" \
            https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz
          echo "c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a  $wasm_pack_archive" | sha256sum --check -
          tar -xzf "$wasm_pack_archive" -C "$RUNNER_TEMP"
          echo "$wasm_pack_dir" >> "$GITHUB_PATH"
      - name: Rebuild and pin the served verifier
        run: |
          test "$(wasm-pack --version)" = "wasm-pack 0.15.0"
          cd verify-rs
          wasm-pack build --target web --features wasm
          sha="$(shasum -a 256 pkg/swarrm_verify_bg.wasm | awk '{print $1}')"
          grep -F "$sha" web/INTEGRITY.txt
          git diff --exit-code -- pkg
          wasm-pack build --target nodejs --out-dir pkg-node --features wasm
      - name: Run browser golden parity
        run: node verify-rs/web/test_parity.cjs
