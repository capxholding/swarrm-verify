name: verifier

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan complete history with the pinned gitleaks release
        run: |
          archive="$RUNNER_TEMP/gitleaks_8.30.0_linux_x64.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks-8.30.0"
          mkdir -p "$install_dir"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  $archive" | sha256sum --check -
          tar -xzf "$archive" -C "$install_dir" gitleaks
          test "$("$install_dir/gitleaks" version)" = "8.30.0"
          "$install_dir/gitleaks" git --no-banner --redact --log-opts='--all' \
            --gitleaks-ignore-path "$GITHUB_WORKSPACE/.gitleaksignore"

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@06e5a564a0556e338780f5aecf2e7dcc9b267f07 # branch 1.90.0
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path verify-rs/Cargo.toml --check
      - run: cargo test --locked --manifest-path verify-rs/Cargo.toml
      - run: cargo clippy --locked --manifest-path verify-rs/Cargo.toml --all-targets -- -D warnings
      - run: git diff --exit-code -- verify-rs/Cargo.lock

  browser-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
      - uses: dtolnay/rust-toolchain@06e5a564a0556e338780f5aecf2e7dcc9b267f07 # branch 1.90.0
        with:
          toolchain: 1.90.0
          targets: wasm32-unknown-unknown
      - name: Install the pinned wasm-pack release
        run: |
          wasm_pack_archive="$RUNNER_TEMP/wasm-pack.tar.gz"
          wasm_pack_dir="$RUNNER_TEMP/wasm-pack-v0.15.0-x86_64-unknown-linux-musl"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$wasm_pack_archive" \
            https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz
          echo "c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a  $wasm_pack_archive" | sha256sum --check -
          tar -xzf "$wasm_pack_archive" -C "$RUNNER_TEMP"
          echo "$wasm_pack_dir" >> "$GITHUB_PATH"
      - name: Rebuild the served verifier
        id: wasm
        run: |
          test "$(wasm-pack --version)" = "wasm-pack 0.15.0"
          cd verify-rs
          wasm-pack build --target web --features wasm --locked
          wasm-pack build --target nodejs --out-dir pkg-node --features wasm --locked
          git diff --exit-code -- Cargo.lock
      - name: Assert the committed browser artifact and pin are current
        if: ${{ !cancelled() && steps.wasm.outcome == 'success' }}
        run: |
          js_sha="$(sha256sum verify-rs/pkg/swarrm_verify.js | awk '{print $1}')"
          wasm_sha="$(sha256sum verify-rs/pkg/swarrm_verify_bg.wasm | awk '{print $1}')"
          grep -F "$js_sha" verify-rs/web/INTEGRITY.txt
          grep -F "$js_sha" verify-rs/web/index.html
          grep -F "$wasm_sha" verify-rs/web/INTEGRITY.txt
          grep -F "$wasm_sha" verify-rs/web/index.html
          git diff --exit-code -- verify-rs/pkg
      - name: Retain the canonical Linux rebuild on provenance failure
        if: ${{ failure() && steps.wasm.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rebuilt-public-verifier-${{ github.sha }}
          path: verify-rs/pkg
          if-no-files-found: error
          retention-days: 1
      - name: Run browser golden parity
        if: ${{ !cancelled() && steps.wasm.outcome == 'success' }}
        run: node verify-rs/web/test_parity.cjs
