name: dependency-audit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rustsec:
    runs-on: ubuntu-24.04
    steps:
      - name: Admit and record the hosted runner baseline
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID/$VERSION_ID" = ubuntu/24.04
          test "$RUNNER_OS/$RUNNER_ARCH/${ImageOS:-}" = Linux/X64/ubuntu24
          test -n "${ImageVersion:-}"
          printf 'Hosted runner: ubuntu-24.04; image=%s; arch=%s; commit=%s\n' \
            "$ImageVersion" "$RUNNER_ARCH" "$GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@06e5a564a0556e338780f5aecf2e7dcc9b267f07 # branch 1.90.0
      - name: Install the pinned RustSec scanner
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit the locked graph with the reviewed VEX exception
        run: |
          cargo audit --file verify-rs/Cargo.lock --ignore RUSTSEC-2023-0071
          bash scripts/check-h22.sh
