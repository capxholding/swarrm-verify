version: 2
updates:
  - package-ecosystem: cargo
    directory: /verify-rs
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Zurich
    versioning-strategy: lockfile-only
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Zurich
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
